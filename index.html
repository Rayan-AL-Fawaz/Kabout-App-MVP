<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabout App - MVP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e9ecef; text-align: center; margin: 0; padding: 20px; }
        .app-container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.2); min-height: 600px; position: relative;}
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input, button, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;}
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-danger { background-color: #dc3545; margin-top: 40px;}
        .btn-danger:hover { background-color: #c82333; }
        .header { font-size: 26px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .logo { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="loginScreen" class="screen active">
        <div class="logo">🚗</div>
        <div class="header">Kabout</div>
        <p style="color: #666; margin-bottom: 30px;">Your Trusted Automotive Service</p>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="showScreen('homeScreen')">Login</button>
    </div>

    <div id="homeScreen" class="screen">
        <div class="header">Dashboard</div>
        <p>What do you need help with today?</p>
        <input type="text" placeholder="Search for services (e.g. Oil Change)">
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <button onclick="showScreen('quoteScreen')">Request Customized Quote</button>
        <button onclick="showScreen('bookingScreen')">Book Appointment</button>
        <button class="btn-danger" onclick="showScreen('loginScreen')">Logout</button>
    </div>

    <div id="quoteScreen" class="screen">
        <div class="header">Request Quote</div>
        <p>Enter vehicle details and damage info</p>
        <input type="text" placeholder="Car Make (e.g. Toyota)">
        <input type="text" placeholder="Car Model (e.g. Camry)">
        <select>
            <option>Select Service Type...</option>
            <option>Mechanical Issue</option>
            <option>Electrical Issue</option>
            <option>Bodywork / Paint</option>
        </select>
        <div style="text-align: left; width: 90%; margin: auto; font-size: 14px; color: #555;">Upload Damage Photos:</div>
        <input type="file" accept="image/*">
        <button onclick="submitQuote()">Submit Request</button>
        <button class="btn-secondary" onclick="showScreen('homeScreen')">Cancel</button>
    </div>

    <div id="bookingScreen" class="screen">
        <div class="header">Book Appointment</div>
        <p>Select your preferred workshop and time</p>
        <select>
            <option>Select Workshop...</option>
            <option>Al-Fares Auto Repair</option>
            <option>QuickFix Garage</option>
        </select>
        <div style="text-align: left; width: 90%; margin: auto; font-size: 14px; color: #555;">Date:</div>
        <input type="date">
        <div style="text-align: left; width: 90%; margin: auto; font-size: 14px; color: #555;">Time:</div>
        <input type="time">
        <button onclick="submitBooking()">Confirm Booking</button>
        <button class="btn-secondary" onclick="showScreen('homeScreen')">Cancel</button>
    </div>

</div>

<script>
    // Navigation logic
    function showScreen(screenId) {
        let screens = document.querySelectorAll('.screen');
        for(let i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }
        document.getElementById(screenId).classList.add('active');
    }

    // Logic for submitting a quote
    function submitQuote() {
        alert("Success! Your quote request has been saved to the database. Workshops will be notified.");
        showScreen('homeScreen');
    }

    // Logic for booking confirmation
    function submitBooking() {
        alert("Booking Confirmed! Your appointment ID is #KB-7842.");
        showScreen('homeScreen');
    }
</script>

</body>
</html>
